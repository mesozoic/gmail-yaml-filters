[tool.poetry]
name = "gmail-yaml-filters"
version = "0.10.0"
description = "A quick tool for generating Gmail filters from YAML rules."
authors = ["Alex Levy <mesozoic@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/mesozoic/gmail-yaml-filters"
homepage = "https://github.com/mesozoic/gmail-yaml-filters"
classifiers = [
  "Topic :: Communications :: Email :: Filters",
]

[tool.poetry.dependencies]
python = "^3.10"
google-api-python-client = "^2.40.0"
lxml = "^6.1.0"
oauth2client = "^4.1.3"
PyYAML = "^6.0"

[tool.poetry.scripts]
gmail-yaml-filters = "gmail_yaml_filters.main:main"

[dependency-groups]
dev = [
    "coverage",
    "google-api-python-client-stubs>=1.29.0,<2",
    "lxml-stubs>=0.5.1,<0.6",
    "mock>=5.2.0,<6",
    "mypy>=1.16.0,<2",
    "pytest>=9.0.3,<10",
    "types-httplib2>=0.22.0.20250516,<0.23",
    "types-pyyaml>=6.0.12.20250516,<7",
]

[[tool.mypy.overrides]]
module = "oauth2client.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
